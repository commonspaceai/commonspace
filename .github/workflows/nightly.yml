name: Nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Fix nightly source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run nightlies from main."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Prepare nightly metadata
        id: metadata
        run: node scripts/nightly-release.mjs prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-metadata
          path: artifacts/nightly/release.json
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux checks and package
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      checks: ${{ steps.checks.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile the distributable
        run: pnpm build
      - name: Build Storybook
        run: pnpm build:storybook
      - name: Full checks and live flow
        id: checks
        continue-on-error: true
        run: |
          status=0
          pnpm exec playwright install --with-deps chromium || status=1
          pnpm biome:check || status=1
          pnpm lint || status=1
          pnpm typecheck || status=1
          pnpm test || status=1
          pnpm test:storybook || status=1
          pnpm docs:contracts || status=1
          pnpm verify:live:built || status=1
          exit "$status"
      - name: Package the nightly version
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/package-npm.mjs --nightly-version "$NIGHTLY_VERSION"
      - name: Verify the exact tarball on Linux
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/verify-npm-package.mjs "artifacts/npm/commonspace-${NIGHTLY_VERSION}.tgz" "$NIGHTLY_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commonspace-nightly-package
          path: artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS visual and messaging
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      checks: ${{ steps.checks.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:storybook
      - name: Reviewed visual and messaging checks
        id: checks
        continue-on-error: true
        run: |
          status=0
          pnpm exec playwright install chromium || status=1
          pnpm test:visual:built || status=1
          pnpm test:messaging:built || status=1
          exit "$status"

  windows:
    name: Windows runtime and package
    needs: [prepare, linux]
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      checks: ${{ steps.checks.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Portable and browser checks
        id: checks
        continue-on-error: true
        run: |
          $failed = $false
          pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          pnpm test:platform
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          pnpm test:storybook:smoke
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          pnpm test:e2e:built
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          pnpm verify:live:built
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commonspace-nightly-package
          path: artifacts/npm
      - name: Verify the exact Linux-built tarball on Windows
        env:
          NIGHTLY_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/verify-npm-package.mjs "artifacts/npm/commonspace-$env:NIGHTLY_VERSION.tgz" "$env:NIGHTLY_VERSION"

  publish:
    name: Publish classified nightly
    needs: [prepare, linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-metadata
          path: artifacts/nightly
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commonspace-nightly-package
          path: artifacts/npm
      - name: Classify checks and write release notes
        id: classify
        env:
          LINUX_CHECKS: ${{ needs.linux.outputs.checks }}
          MACOS_CHECKS: ${{ needs.macos.outputs.checks }}
          WINDOWS_CHECKS: ${{ needs.windows.outputs.checks }}
        run: node scripts/nightly-release.mjs classify
      - name: Publish immutable dated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.classify.outputs.tag }}
          STATUS: ${{ steps.classify.outputs.status }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG" > artifacts/nightly/dated-ref.json 2>/dev/null; then
            current_sha="$(node -p 'JSON.parse(require("node:fs").readFileSync("artifacts/nightly/dated-ref.json", "utf8")).sha')"
            test "$current_sha" = "$SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "::notice::Release $TAG is already published; preserving its assets."
              exit 0
            fi
          else
            gh release create "$TAG" --target "$SHA" --title "Commonspace $VERSION ($STATUS)" --notes-file artifacts/nightly/notes.md --draft --prerelease --latest=false
          fi
          gh release upload "$TAG" artifacts/npm/*.tgz artifacts/nightly/SHA256SUMS.txt artifacts/nightly/release.json --clobber
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG" --jq .sha)"
          test "$current_sha" = "$SHA"
          gh release edit "$TAG" --notes-file artifacts/nightly/notes.md --draft=false --prerelease=true --latest=false
      - name: Update recommended nightly
        if: steps.classify.outputs.status == 'nightly-green'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.classify.outputs.tag }}
        run: |
          if gh release view nightly-green >/dev/null 2>&1; then
            gh release view nightly-green --json body --jq .body > artifacts/nightly/previous-notes.md
            previous_data="$(node scripts/nightly-release.mjs read-pointer artifacts/nightly/previous-notes.md)"
            read -r previous_tag previous <<< "$previous_data"
            if ! git merge-base --is-ancestor "$previous" "$SHA"; then
              echo "::notice::Keeping the newer recommended nightly."
              exit 0
            fi
            if [ "$previous" = "$SHA" ] && [ "$(node scripts/nightly-release.mjs is-later "$TAG" "$previous_tag")" != true ]; then
              echo "::notice::Keeping the later build of this commit."
              exit 0
            fi
            gh release edit nightly-green --notes-file artifacts/nightly/recommended-notes.md --prerelease=true --latest=false
          else
            gh release create nightly-green --target "$SHA" --title 'Latest recommended nightly' --notes-file artifacts/nightly/recommended-notes.md --prerelease --latest=false
          fi
      - name: Surface failed nightly checks
        if: steps.classify.outputs.status == 'nightly-broken'
        run: |
          echo "::error::Published a debug nightly with failed checks. The recommendation was not changed."
          exit 1
