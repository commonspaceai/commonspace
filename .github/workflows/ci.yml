name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Quality and Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Check formatting and static analysis
        run: pnpm biome:check
      - name: Lint source code
        run: pnpm lint
      - name: Check TypeScript contracts
        run: pnpm typecheck
      - name: Build the application
        run: pnpm build
      - name: Build Storybook
        run: pnpm build:storybook
      - name: Build the Linux npm candidate
        run: pnpm package:npm
      - name: Verify the Linux npm candidate
        run: pnpm verify:npm-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commonspace-linux-candidate
          path: artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 1

  unit:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Run unit and integration tests
        run: pnpm test
      - name: Run native adapter integration tests
        run: pnpm verify:adapters

  browser:
    name: Linux browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Install browser and operating-system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Storybook browser tests
        run: pnpm test:storybook
      - name: Build the application
        run: pnpm build
      - name: Run built application browser flows
        run: pnpm test:e2e:built
      - name: Run live application verification
        run: pnpm verify:live:built
      - name: Upload integrated browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commonspace-e2e-failure
          path: |
            tests/e2e/artifacts/e2e-results
            tests/e2e/artifacts/e2e-report
            artifacts/experience-audit
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: macOS visual and messaging
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Install managed Chromium
        run: pnpm exec playwright install chromium
      - name: Build Storybook
        run: pnpm build:storybook
      - name: Verify reviewed macOS visual baselines
        run: pnpm test:visual:built
      - name: Verify Storybook messaging flows
        run: pnpm test:messaging:built
      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commonspace-visual-failure
          path: |
            artifacts/playwright-visual-results
            artifacts/playwright-visual-report
            artifacts/playwright-messaging-results
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows runtime
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Record platform
        run: node -e "console.log(JSON.stringify({platform:process.platform,arch:process.arch,node:process.version}))"
      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript contracts
        run: pnpm typecheck
      - name: Run portable platform tests
        run: pnpm test:platform
      - name: Install managed Chromium
        run: pnpm exec playwright install chromium
      - name: Run representative Storybook browser tests
        run: pnpm test:storybook:smoke
      - name: Build the application
        run: pnpm build
      - name: Run built application browser flows
        run: pnpm test:e2e:built
      - name: Run live application verification
        run: pnpm verify:live:built
      - name: Upload Windows failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commonspace-windows-failure
          path: |
            tests/e2e/artifacts/e2e-results
            tests/e2e/artifacts/e2e-report
            artifacts/experience-audit
          if-no-files-found: ignore
          retention-days: 7

  package-windows:
    name: Linux package on Windows
    needs: static
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: commonspace-linux-candidate
          path: artifacts/npm-linux
      - name: Verify the Linux-built candidate tarball
        run: |
          $archives = @(Get-ChildItem artifacts/npm-linux/*.tgz)
          if ($archives.Count -ne 1) { throw "Expected one Linux-built npm tarball" }
          node scripts/verify-npm-package.mjs $archives[0].FullName

  check:
    name: Required CI gate
    if: always()
    needs: [static, unit, browser, visual, windows, package-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI gate
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          PACKAGE_WINDOWS_RESULT: ${{ needs.package-windows.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$VISUAL_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
          test "$PACKAGE_WINDOWS_RESULT" = "success"
