name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v0.0.1).
        required: true
        type: string
      dry_run:
        description: Verify package without publishing it.
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Require workflow dispatch from main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::Run the release workflow from main."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Require exact tag and package version
        id: version
        run: |
          node scripts/package-npm.mjs --check-tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require publication to be explicitly enabled
        if: ${{ github.event_name == 'release' || ! inputs.dry_run }}
        env:
          NPM_RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
        run: |
          if [[ "$NPM_RELEASE_ENABLED" != "true" ]]; then
            echo "::error::Set NPM_RELEASE_ENABLED=true only after npm package ownership and trusted publishing are configured."
            exit 1
          fi

  verify:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm verify:live:built
      - run: pnpm package:npm
      - run: pnpm verify:npm-package
      - name: Preview npm publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish artifacts/npm/*.tgz --dry-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commonspace-npm-package
          path: artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 1

  windows-package:
    needs: [resolve, verify]
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commonspace-npm-package
          path: artifacts/npm
      - name: Verify the exact Linux-built release tarball on Windows
        run: node scripts/verify-npm-package.mjs

  publish:
    if: ${{ github.repository == 'commonspaceai/commonspace' && (github.event_name == 'release' || ! inputs.dry_run) }}
    needs: [resolve, verify, windows-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: commonspace-npm-package
          path: artifacts/npm
      - name: Require unchanged release tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)"
          if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::Release tag moved after verification. Refusing to publish."
            exit 1
          fi
      - name: Publish npm package
        run: |
          dist_tag=latest
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            dist_tag=next
          fi
          package_name="$(node -p "require('./cli/package.json').name")"
          package_version="${RELEASE_TAG#v}"
          registry_error="$(mktemp)"
          trap 'rm -f "$registry_error"' EXIT
          set +e
          existing_version="$(npm view "${package_name}@${package_version}" version --json 2>"$registry_error")"
          view_status=$?
          set -e
          existing_version="${existing_version//\"/}"
          if [[ "$view_status" -eq 0 ]]; then
            if [[ "$existing_version" == "$package_version" ]]; then
              echo "${package_name}@${package_version} is already published; skipping duplicate publish."
              exit 0
            fi
            echo "::error::Registry returned unexpected version ${existing_version} for ${package_name}@${package_version}."
            exit 1
          fi
          if ! grep -Eq 'E404|404' "$registry_error"; then
            echo "::error::Unable to check ${package_name}@${package_version} before publishing."
            cat "$registry_error"
            exit 1
          fi
          npm publish artifacts/npm/*.tgz --access public --provenance --tag "$dist_tag"
      - name: Create GitHub release for manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.resolve.outputs.sha }}" \
            --verify-tag \
            --prerelease="$RELEASE_PRERELEASE" \
            --title "Commonspace $RELEASE_TAG" \
            --generate-notes
